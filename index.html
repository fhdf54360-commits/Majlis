<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>مجلس — اجتماعات أونلاين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b1120;--bg2:#111a33;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--txt:#fff;--mut:#9fb0cf;--acc:#3b82f6;--acc2:#22d3ee;--vio:#8b5cf6;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--txt);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;overflow-x:clip}
html{background:var(--bg1)}body{background:transparent}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 50% at 100% 0%,rgba(59,130,246,.2),transparent 60%),radial-gradient(60% 45% at 0% 100%,rgba(34,211,238,.12),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2))}
button,input{font-family:inherit}
#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(11,17,32,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:19px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.logo b{background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.namebox{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;min-width:0;flex:1;max-width:300px}
.namebox:focus-within{border-color:var(--acc)}
.namebox span{font-size:13px;color:var(--mut);white-space:nowrap}
.namebox input{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:0;color:#fff;font-weight:800;font-size:16px;padding:5px 2px}
#chips{display:flex;gap:6px;align-items:center;margin-inline-start:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap;color:#fff;font-weight:600}
button.chip{cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#888}.dot.d{background:var(--ok)}.dot.s{background:#38bdf8}.dot.x{background:var(--bad)}
#wrap{max-width:1100px;margin:0 auto;padding:0 14px calc(120px + env(safe-area-inset-bottom))}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}
.hero{text-align:center;padding:30px 0 8px}
.hero .ic{font-size:48px;line-height:1.1}
.hero .big{font-size:50px;font-weight:800;line-height:1.25;background:linear-gradient(90deg,#60a5fa,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:4px 0 0;font-size:16px;font-weight:600}
.home{max-width:540px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:17px;color:#fff;cursor:pointer;margin:8px 0;
  background:linear-gradient(180deg,#60a5fa,#2563eb);box-shadow:0 4px 0 #1e3a8a;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1e3a8a}
.btn.vio{background:linear-gradient(180deg,#a78bfa,#7c3aed);box-shadow:0 4px 0 #4c1d95}
.btn.teal{background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:0 4px 0 #14532d}
.btn.sec{background:rgba(255,255,255,.1);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);box-shadow:none}
.btn.small{padding:10px 14px;font-size:15px;border-radius:14px}
.btn.auto{width:auto;margin:0;flex:0 0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{margin:0;flex-direction:column;gap:2px;padding:14px 8px}
.two .btn small{font-size:12px;font-weight:600;opacity:.85}
.row{display:flex;gap:8px;align-items:center}
.lb{display:block;font-size:14px;color:var(--mut);margin:0 0 6px;font-weight:600}
.sect{font-weight:800;font-size:16px;margin:0 0 10px}
.inp{flex:1;min-width:0;width:100%;font-size:16px;font-weight:600;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:rgba(0,0,0,.3);color:#fff;outline:none}
.inp:focus{border-color:var(--acc)}
.inp.ltr{direction:ltr;text-align:left}
.inp.num{direction:ltr;text-align:center;letter-spacing:6px;font-size:22px;font-weight:800}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:12px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.hint{font-size:13.5px;color:var(--mut);text-align:center;margin-top:8px;line-height:1.7}
.err{color:#fca5a5;text-align:center;font-weight:700;margin-top:8px}
.c{text-align:center}.mut{color:var(--mut)}.small{font-size:13px}
.spin{width:50px;height:50px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:var(--acc2);animation:sp 1s linear infinite;margin:40px auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
/* بطاقة معلومات الغرفة */
.info .irow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.code{font-size:34px;font-weight:800;letter-spacing:5px;direction:ltr;line-height:1.1}
.code.pin{color:#c4b5fd}
.tag{font-size:12px;border-radius:8px;padding:3px 8px;background:rgba(255,255,255,.12);font-weight:800;white-space:nowrap}
.tag.host{background:rgba(250,204,21,.2);color:#fde68a}.tag.scr{background:rgba(59,130,246,.3);color:#bfdbfe}.tag.priv{background:rgba(139,92,246,.3);color:#ddd6fe}.tag.pub{background:rgba(34,197,94,.2);color:#bbf7d0}
.invite{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.invite .inp{flex:1 1 200px;padding:10px 12px;font-size:13px}
.soundbar{margin:12px 0}
/* شاشة العرض */
#stagebox.stage{position:relative;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin:12px 0;aspect-ratio:16/9;max-height:72vh;width:100%;display:flex;align-items:center;justify-content:center}
#stagebox img,#stagebox canvas{width:100%;height:100%;object-fit:contain;display:none}
#stagebox img.show,#stagebox canvas.show{display:block}
#stagebox .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);font-weight:600;text-align:center;padding:10px}
#stagebox .ph .spin{margin:0 0 12px}
#stagebox .lbl{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.65);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stagebox .sbtns{position:absolute;bottom:10px;inset-inline-start:10px;display:flex;gap:6px;flex-wrap:wrap}
#stagebox .sbtn{border:0;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13.5px;color:#fff;background:rgba(0,0,0,.65);cursor:pointer}
#stagebox .sbtn.stop{background:var(--bad)}
#stagebox:fullscreen{aspect-ratio:auto;max-height:none;border-radius:0;border:0}
#stagebox.max{position:fixed;inset:0;z-index:60;aspect-ratio:auto;max-height:none;margin:0;border-radius:0}
/* المشاركين */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.tile{position:relative;aspect-ratio:4/3;border-radius:18px;background:linear-gradient(160deg,#18233f,#0e1630);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,box-shadow .15s;min-width:0}
.tile.spk{border-color:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.35)}
.tile .av{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;background:hsl(var(--h) 55% 42%)}
.grid.sm .tile .av{width:42px;height:42px;font-size:19px}
.tile .nm{font-weight:800;font-size:15px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid.sm .tile .nm{font-size:13px}
.tile .bd{position:absolute;top:7px;inset-inline-start:7px;display:flex;gap:4px}
.tile .mi{position:absolute;bottom:7px;inset-inline-end:7px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(239,68,68,.25)}
.tile .mi.on{background:rgba(34,197,94,.25)}
.tile .cn{position:absolute;bottom:9px;inset-inline-start:9px;font-size:12px;opacity:.75}
/* شريط التحكم */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;display:flex;gap:8px;padding:9px;background:rgba(15,23,45,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.cb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;padding:8px 10px;border:0;border-radius:16px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.cb .i{font-size:23px;line-height:1.1}
.cb.off{background:rgba(239,68,68,.2);color:#fecaca}
.cb.on{background:rgba(34,197,94,.24);color:#bbf7d0}
.cb.leave{background:var(--bad)}
.cb:active{transform:scale(.95)}
/* قائمة اختيار العرض */
#sheet{position:fixed;inset:0;z-index:70;background:rgba(5,8,20,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;padding:12px}
#sheet.show{display:flex}
.sh-card{width:100%;max-width:480px;background:linear-gradient(170deg,#1a2747,#0d1630);border:1px solid var(--line);border-radius:24px;padding:18px 16px calc(12px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sh-t{font-weight:800;font-size:19px;margin-bottom:10px;text-align:center}
.sh-o{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;margin:7px 0;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:#fff;cursor:pointer}
.sh-o .i{font-size:28px}
.sh-o b{display:block;font-size:16px}.sh-o small{display:block;color:var(--mut);font-size:12.5px;font-weight:600}
.sh-o:active{background:rgba(59,130,246,.2)}
.sh-o.sel{border-color:var(--ok);background:rgba(34,197,94,.12)}
#imgpick,#vidpick,#chpick,#chcampick{display:none}
/* الدردشة */
#chat{position:fixed;z-index:55;bottom:calc(96px + env(safe-area-inset-bottom));inset-inline-end:12px;width:min(420px,calc(100% - 24px));height:min(62vh,540px);display:none;flex-direction:column;background:linear-gradient(170deg,#1a2747,#0d1630);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.5);overflow:hidden;animation:up .2s ease}
#chat.show{display:flex}
.ch-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:800}
.ch-x{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:4px 10px;cursor:pointer;font-weight:800}
#chlist{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;align-self:flex-start;background:rgba(255,255,255,.08);border-radius:16px;padding:7px 11px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:rgba(59,130,246,.35)}
.msg .who{font-size:11.5px;color:var(--acc2);font-weight:800;margin-bottom:2px}
.msg .tx{font-size:15px;font-weight:600;white-space:pre-wrap;line-height:1.6}
.msg img{display:block;max-width:100%;max-height:240px;border-radius:12px;cursor:zoom-in;margin-top:2px}
.ch-f{display:flex;gap:6px;align-items:center;padding:8px;border-top:1px solid var(--line)}
.ch-f .inp{padding:10px 12px}
.ch-b{flex:none;width:42px;height:42px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:19px;cursor:pointer}
.ch-b.go{background:var(--acc);transform:scaleX(-1)}
#chcam{display:none;position:relative;background:#000}
#chcam.show{display:block}
#chcam video{width:100%;max-height:34vh;display:block;object-fit:contain}
#chcam .row{position:absolute;bottom:8px;left:0;right:0;justify-content:center}
#chview{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#chview.show{display:flex}
#chview img{max-width:100%;max-height:100%;object-fit:contain}
.cb{position:relative}
.cb .nb{position:absolute;top:3px;inset-inline-end:6px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 4px}
.cb .nb:empty{display:none}
.room{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin:8px 0}
.room .rav{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:hsl(var(--h) 55% 42%)}
.room .ri{flex:1;min-width:0}.room .rn{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.room .rs{font-size:12.5px;color:var(--mut)}
.grid.sm .tile{aspect-ratio:auto;padding:28px 6px 32px}
.grid.sm .tile .tag{font-size:10px;padding:2px 5px}
@media (max-width:640px){#top{flex-wrap:wrap;row-gap:8px}.namebox{max-width:none}#chips{margin:0;width:100%;justify-content:flex-start}#chips:empty{display:none}}
@media (max-width:440px){.cb{min-width:0;padding:8px 9px;font-size:11px}.cb .i{font-size:21px}.bar{gap:6px;padding:7px}.namebox span{display:none}.logo span{display:none}.hero .big{font-size:42px}.code{font-size:28px}.bar{width:calc(100% - 12px);justify-content:space-between}.cb{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis}#chat{bottom:calc(84px + env(safe-area-inset-bottom))}}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160px);background:#fff;color:#0b1120;font-weight:800;padding:12px 18px;border-radius:16px;z-index:99;transition:transform .3s;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:15px}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<header id="top">
  <div class="logo">📞 <b>مجلس</b></div>
  <label class="namebox"><span>اسمك:</span><input id="nm" maxlength="20" placeholder="اكتب اسمك" autocomplete="off"></label>
  <div id="chips"></div>
</header>
<div id="wrap">
  <div id="stagebox"></div>
  <div id="app"></div>
</div>
<div id="sheet"></div>
<div id="chat"><div class="ch-h"><span>💬 الدردشة</span><button class="ch-x" data-a="chatx">✕</button></div><div id="chlist"></div><div id="chcam"><video id="chvid" muted playsinline autoplay></video><div class="row"><button class="btn teal small auto" data-a="chsnap">📸 التقط وأرسل</button><button class="btn sec small auto" data-a="chcamx">إلغاء</button></div></div><div class="ch-f"><button class="ch-b" data-a="chcam" title="الكاميرا">📷</button><button class="ch-b" data-a="chimg" title="صورة">🖼️</button><input class="inp" id="chin" maxlength="500" placeholder="اكتب رسالة…" autocomplete="off"><button class="ch-b go" data-a="chsend" title="إرسال">➤</button></div></div>
<div id="chview"><img id="chvimg" alt=""></div>
<input type="file" id="chpick" accept="image/*">
<input type="file" id="chcampick" accept="image/*" capture="environment">
<input type="file" id="imgpick" accept="image/*">
<input type="file" id="vidpick" accept="video/*">
<div id="toast"></div>
<script>
'use strict';
/* ================= 1) إعدادات ================= */
const MAX_PEOPLE = 12;
const BROKERS_DEFAULT = [
  {name:'hivemq',   url:'wss://broker.hivemq.com:8884/mqtt'},
  {name:'emqx',     url:'wss://broker.emqx.io:8084/mqtt'},
  {name:'mosquitto',url:'wss://test.mosquitto.org:8081/mqtt'},
];
const URLP = new URLSearchParams(location.search);
const BROKERS = URLP.get('broker') ? [{name:'custom', url:URLP.get('broker')}] : BROKERS_DEFAULT; // ?broker= للتجربة فقط
const TOPIC_ROOT = 'majlis-call-ar/v1/';
const RTC_CFG = {iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
/* جودة عرض الشاشة: تنزل وتطلع لحالها حسب النت (0 = أعلى جودة) */
const LV = [
  {w:1280,h:800,q:.6, g:400},
  {w:1024,h:640,q:.5, g:700},
  {w:854, h:534,q:.45,g:1000},
  {w:720, h:450,q:.4, g:1400},
  {w:560, h:350,q:.36,g:2000},
];
const LV_NAMES = ['عالية جدًا','عالية','متوسطة','منخفضة','منخفضة جدًا'];
/* عرض الشاشة والكاميرا كفيديو حقيقي (أنعم وأخف بكثير من الصور): المقاس وعدد الإطارات والجودة لكل مستوى.
   النت قوي = المستوى 0 (سلس)، ضعيف = ينزل لحاله ويقلل الإطارات والجودة */
const VLV = [
  {w:1280,h:720,fps:15,br:600000},
  {w:1280,h:720,fps:10,br:380000},
  {w:960, h:540,fps:8, br:240000},
  {w:854, h:480,fps:6, br:150000},
  {w:640, h:360,fps:4, br:85000},
];
const VCODECS = ['vp8','avc1.42001f'];

/* ================= 2) أدوات ================= */
const $ = s=>document.querySelector(s);
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const rand = n=>Math.floor(Math.random()*n);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rid(n=8){const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';for(const x of crypto.getRandomValues(new Uint8Array(n)))s+=a[x%a.length];return s}
const pin4 = ()=>String(1000+crypto.getRandomValues(new Uint32Array(1))[0]%9000);
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000)}
const cleanName = s=>String(s==null?'':s).trim().slice(0,20)||'مشارك';
const u8b64 = u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const b64u8 = b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

/* ================= 3) عميل MQTT مصغّر (3.1.1 عبر WSS) — منقول من اللعبة ================= */
class MiniMQTT{
  constructor(url,{clientId,will,keepalive=30}={}){this.url=url;this.clientId=clientId;this.will=will;this.keepalive=keepalive;this.handlers=[];this.subs=new Set();this.pid=0;this.buf=new Uint8Array(0);this.connected=false;this.closedByUser=false;this.onclose=null}
  static enc(s){return new TextEncoder().encode(s)}
  static str(s){const b=MiniMQTT.enc(s);const o=new Uint8Array(b.length+2);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
  static cat(...a){let n=0;for(const x of a)n+=x.length;const o=new Uint8Array(n);let i=0;for(const x of a){o.set(x,i);i+=x.length}return o}
  static pkt(h,body){const len=[];let x=body.length;do{let d=x%128;x=Math.floor(x/128);if(x>0)d|=128;len.push(d)}while(x>0);return MiniMQTT.cat(new Uint8Array([h,...len]),body)}
  connect(timeout=6000){
    return new Promise((res,rej)=>{
      let done=false;this.buf=new Uint8Array(0);
      const fail=e=>{if(done)return;done=true;clearTimeout(to);try{ws&&ws.close()}catch(_){}rej(e)};
      const to=setTimeout(()=>fail(new Error('timeout')),timeout);
      let ws;
      try{ws=new WebSocket(this.url,['mqtt'])}catch(e){return fail(e)}
      this.ws=ws;ws.binaryType='arraybuffer';
      ws.onopen=()=>{
        let flags=0x02;const payload=[MiniMQTT.str(this.clientId)];
        if(this.will){flags|=0x04;if(this.will.retain)flags|=0x20;payload.push(MiniMQTT.str(this.will.topic));const m=MiniMQTT.enc(this.will.payload||'');payload.push(new Uint8Array([m.length>>8,m.length&255]),m)}
        ws.send(MiniMQTT.pkt(0x10,MiniMQTT.cat(MiniMQTT.str('MQTT'),new Uint8Array([4,flags,this.keepalive>>8,this.keepalive&255]),...payload)));
      };
      this._onConnack=rc=>{if(done)return;if(rc!==0)return fail(new Error('rc '+rc));done=true;clearTimeout(to);this.connected=true;this.closedByUser=false;
        clearInterval(this.pingI);this.pingI=setInterval(()=>this._send(new Uint8Array([0xC0,0])),this.keepalive*800);res(this)};
      ws.onmessage=e=>{if(this.ws===ws)this._data(new Uint8Array(e.data))};
      ws.onerror=()=>fail(new Error('ws error'));
      ws.onclose=()=>{if(this.ws!==ws)return;clearInterval(this.pingI);const was=this.connected;this.connected=false;if(!done){fail(new Error('closed'));return}
        if(was&&!this.closedByUser&&this.onclose)this.onclose()};
    });
  }
  _data(chunk){
    this.buf=MiniMQTT.cat(this.buf,chunk);
    while(this.buf.length>=2){
      let mul=1,len=0,i=1,b;
      do{if(i>=this.buf.length)return;b=this.buf[i++];len+=(b&127)*mul;mul*=128}while(b&128);
      if(this.buf.length<i+len)return;
      const h=this.buf[0],body=this.buf.slice(i,i+len);this.buf=this.buf.slice(i+len);
      this._packet(h,body);
    }
  }
  _packet(h,b){
    const type=h>>4;
    if(type===2){this._onConnack&&this._onConnack(b[1]);return}
    if(type===3){
      const qos=(h>>1)&3,tl=(b[0]<<8)|b[1];const topic=new TextDecoder().decode(b.subarray(2,2+tl));let p=2+tl;
      if(qos>0){const i0=b[p],i1=b[p+1];p+=2;if(qos===1)this._send(new Uint8Array([0x40,2,i0,i1]))}
      const payload=new TextDecoder().decode(b.subarray(p));
      for(const fn of this.handlers.slice()){try{fn(topic,payload,!!(h&1))}catch(e){console.error(e)}}
    }
  }
  _send(u8){if(this.ws&&this.ws.readyState===1)this.ws.send(u8)}
  _id(){this.pid=(this.pid%65535)+1;return new Uint8Array([this.pid>>8,this.pid&255])}
  publish(topic,msg,retain=false){this._send(MiniMQTT.pkt(0x30|(retain?1:0),MiniMQTT.cat(MiniMQTT.str(topic),MiniMQTT.enc(msg))))}
  subscribe(topic){this.subs.add(topic);this._send(MiniMQTT.pkt(0x82,MiniMQTT.cat(this._id(),MiniMQTT.str(topic),new Uint8Array([0]))))}
  unsubscribe(topic){this.subs.delete(topic);this._send(MiniMQTT.pkt(0xA2,MiniMQTT.cat(this._id(),MiniMQTT.str(topic))))}
  on(fn){this.handlers.push(fn)}
  end(){this.closedByUser=true;clearInterval(this.pingI);this._send(new Uint8Array([0xE0,0]));const ws=this.ws;setTimeout(()=>{try{ws&&ws.close()}catch(_){}},80)}
}

/* ================= 4) طبقة الشبكة — منقولة من اللعبة (+ قناة f لعرض الشاشة) ================= */
const Net = {key:null,mq:null,idx:0,code:null,isHost:false,myId:null,hostId:null,peers:{},hp:null,leaving:false,reconnecting:false,helloI:null};
const tp = s=>TOPIC_ROOT+Net.code+s;
const newClient = (i,will)=>new MiniMQTT(BROKERS[i].url,{clientId:'mj_'+rid(12),will});

/* المضيف يختار أسرع خادم */
function connectFastest(will){
  return new Promise((res,rej)=>{
    let won=false,fails=0;
    BROKERS.forEach((b,i)=>{
      const mq=newClient(i,will);
      mq.connect().then(()=>{if(won){mq.end();return}won=true;res({mq,idx:i})})
        .catch(()=>{if(++fails===BROKERS.length&&!won)rej(new Error('no broker'))});
    });
  });
}
/* الاتصال بكل الخوادم مع بعض (للبحث عن الغرفة) */
function connectAll(ms=6000){
  const indices=BROKERS.map((_,i)=>i);
  return new Promise(res=>{
    const out=[];let settled=0,fin=false;
    const finish=()=>{if(fin)return;fin=true;res(out)};
    setTimeout(finish,ms);
    indices.forEach(i=>{const mq=newClient(i);mq.connect(ms-300).then(()=>{if(fin){mq.end();return}out.push({mq,idx:i});if(++settled===indices.length)finish()}).catch(()=>{if(++settled===indices.length)finish()})});
  });
}
const isDirect = id=>{const p=Net.peers[id];return !!(p&&p.r&&p.r.readyState==='open')};

/* العميل → المضيف (المباشر أولاً تلقائياً) */
function sendHost(msg,forceMq){
  if(Net.isHost){const m=JSON.parse(JSON.stringify(msg));setTimeout(()=>hostHandle(Net.myId,m),0);return}
  msg.f=Net.myId;const s=JSON.stringify(msg);const hp=Net.hp;
  if(!forceMq&&hp&&hp.r&&hp.r.readyState==='open'){
    const ch=(msg.t==='pi'&&hp.u&&hp.u.readyState==='open')?hp.u:hp.r;
    try{ch.send(s);return}catch(e){}
  }
  if(Net.mq)Net.mq.publish(tp('/h'),s);
}
/* المضيف → مشارك واحد */
function sendTo(id,msg,forceMq){
  if(id===Net.myId){const m=JSON.parse(JSON.stringify(msg));setTimeout(()=>clientHandle(m),0);return}
  const s=JSON.stringify(msg);const p=Net.peers[id];
  if(!forceMq&&p&&p.r&&p.r.readyState==='open'){
    const ch=(msg.t==='po'&&p.u&&p.u.readyState==='open')?p.u:p.r;
    try{ch.send(s);return}catch(e){}
  }
  if(Net.mq)Net.mq.publish(tp('/c/'+id),s);
}
/* المضيف → الجميع */
function broadcast(msg){
  const others=H.players.filter(p=>p.id!==Net.myId&&p.on);
  if(others.length&&!others.some(p=>isDirect(p.id))) Net.mq&&Net.mq.publish(tp('/all'),JSON.stringify(msg));
  else others.forEach(p=>sendTo(p.id,msg));
  sendTo(Net.myId,msg);
}

async function reconnectLoop(){
  if(Net.reconnecting||!Net.mq||Net.leaving)return;
  Net.reconnecting=true;render();
  for(let i=0;i<8&&Net.mq&&!Net.leaving;i++){
    await sleep(800*(i+1));
    if(!Net.mq||Net.leaving)break;
    try{
      await Net.mq.connect();
      [...Net.mq.subs].forEach(s=>Net.mq.subscribe(s));
      Net.reconnecting=false;
      if(Net.isHost)publishRoom();else sendHost({t:'sync'},true);
      render();return;
    }catch(e){}
  }
  Net.reconnecting=false;
  if(Net.leaving)return;
  if(!Net.isHost)hostGone('انقطع الاتصال');else{toast('انقطع الاتصال بالخادم');render()}
}

/* ---------- WebRTC ---------- */
async function p2pStart(){
  if(Net.isHost||typeof RTCPeerConnection==='undefined')return;
  let pc;try{pc=new RTCPeerConnection(RTC_CFG)}catch(e){return}
  const hp=Net.hp={pc,q:[],r:null,u:null,f:null,t:null};
  hp.r=pc.createDataChannel('r',{ordered:true});
  hp.u=pc.createDataChannel('u',{ordered:false,maxRetransmits:0});
  hp.f=pc.createDataChannel('f',{ordered:true}); // صور عرض الشاشة
  const onmsg=ev=>{try{clientHandle(JSON.parse(ev.data))}catch(e){}};
  hp.r.onmessage=onmsg;hp.u.onmessage=onmsg;hp.f.onmessage=onmsg;
  hp.r.onopen=()=>{clearTimeout(hp.t);C.direct=true;sendHost({t:'sync'});render()};
  hp.r.onclose=()=>{if(Net.hp===hp){Net.hp=null;if(C.direct){C.direct=false;if(C.joined){sendHost({t:'sync'},true);render()}}}};
  pc.onicecandidate=e=>{if(e.candidate)sendHost({t:'ice',d:e.candidate.toJSON()},true)};
  try{
    const off=await pc.createOffer();await pc.setLocalDescription(off);
    sendHost({t:'rtc',d:{type:'offer',sdp:pc.localDescription.sdp}},true);
  }catch(e){try{pc.close()}catch(_){}if(Net.hp===hp)Net.hp=null;return}
  hp.t=setTimeout(()=>{if(hp.r.readyState!=='open'){try{pc.close()}catch(e){}if(Net.hp===hp)Net.hp=null;C.direct=false;render()}},10000);
}
async function clientRtc(d){
  const hp=Net.hp;if(!hp||!d||d.type!=='answer')return;
  try{await hp.pc.setRemoteDescription(d);hp.q.forEach(c=>hp.pc.addIceCandidate(c).catch(()=>{}));hp.q=[]}catch(e){}
}
function clientIce(d){const hp=Net.hp;if(!hp||!d)return;if(hp.pc.remoteDescription)hp.pc.addIceCandidate(d).catch(()=>{});else hp.q.push(d)}
async function hostRtc(id,d){
  if(!d||d.type!=='offer')return;
  const old=Net.peers[id];if(old){try{old.pc.close()}catch(e){}}
  let pc;try{pc=new RTCPeerConnection(RTC_CFG)}catch(e){return}
  const p=Net.peers[id]={pc,r:null,u:null,f:null,q:[]};
  const setDirect=v=>{if(Net.peers[id]!==p)return;const pl=P(id);if(pl&&pl.direct!==v){pl.direct=v;pushRoom()}};
  pc.onicecandidate=e=>{if(e.candidate)sendTo(id,{t:'ice',d:e.candidate.toJSON()},true)};
  pc.ondatachannel=e=>{
    const ch=e.channel;
    ch.onmessage=ev=>{try{hostHandle(id,JSON.parse(ev.data))}catch(_){}};
    if(ch.label==='r'){p.r=ch;ch.onopen=()=>setDirect(true);ch.onclose=()=>{setDirect(false);if(Net.peers[id]===p)delete Net.peers[id]};if(ch.readyState==='open')setDirect(true)}
    else if(ch.label==='u')p.u=ch;
    else if(ch.label==='f')p.f=ch;
  };
  try{
    await pc.setRemoteDescription(d);p.q.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));p.q=[];
    const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
    sendTo(id,{t:'rtc',d:{type:'answer',sdp:pc.localDescription.sdp}},true);
  }catch(e){try{pc.close()}catch(_){}delete Net.peers[id];return}
  setTimeout(()=>{if(Net.peers[id]===p&&!(p.r&&p.r.readyState==='open')){try{pc.close()}catch(e){}delete Net.peers[id]}},10000);
}
function hostIce(id,d){const p=Net.peers[id];if(!p||!d)return;if(p.pc.remoteDescription)p.pc.addIceCandidate(d).catch(()=>{});else p.q.push(d)}

/* ================= 5) المضيف (اللي أنشأ الغرفة) ================= */
const H = {priv:false,players:[],sharer:null,sk:'screen',lastFrame:null,fin:{},lastFid:0,lastMqFrame:0,skipRun:0,rj:{}};
const P = id=>H.players.find(p=>p.id===id);
const active = ()=>H.players.filter(p=>p.on);

async function createRoom(priv){
  const name=myName();C.screen='connecting';C.connMsg=priv?'جاري إنشاء غرفة خاصة…':'جاري إنشاء الغرفة…';render();
  await CAPP;
  H.priv=!!priv;Net.key=priv?pin4():null;
  Net.isHost=true;Net.leaving=false;Net.myId=rid();Net.hostId=Net.myId;
  let ok=false;
  for(let attempt=0;attempt<3&&!ok;attempt++){
    Net.code=String(10000+rand(90000));
    try{
      const {mq,idx}=await connectFastest({topic:tp('/room'),payload:'',retain:true});
      // تأكد إن الرمز غير مستخدم
      const taken=await new Promise(r=>{const t=setTimeout(()=>r(false),700);mq.on((topic,p)=>{if(topic===tp('/room')&&p){clearTimeout(t);r(true)}});mq.subscribe(tp('/room'))});
      if(taken){mq.end();continue}
      mq.unsubscribe(tp('/room'));mq.handlers=[hostMq];
      Net.mq=mq;Net.idx=idx;mq.onclose=reconnectLoop;ok=true;
    }catch(e){break}
  }
  if(Net.leaving){if(Net.mq)Net.mq.end();Net.mq=null;Net.isHost=false;return}
  if(!ok){Net.isHost=false;Net.key=null;toast('تعذّر الاتصال بالخوادم، جرّب مرة ثانية');goHome();return}
  Net.mq.subscribe(tp('/h'));
  Object.assign(H,{players:[],sharer:null,sk:'screen',lastFrame:null,fin:{},lastFid:0,skipRun:0,rj:{}});
  H.players.push({id:Net.myId,name,on:true,seen:Date.now(),mic:false,direct:true,op:CAP.o,vd:CAP.vd.slice()});
  C.joined=true;C.me=Net.myId;C.screen=null;
  setUrlRoom();publishRoom();pushRoom();
  toast(priv?'🔒 الغرفة الخاصة جاهزة — أرسل الرابط':'✅ الغرفة جاهزة — أرسل الكود أو الرابط');
}
function hostMq(topic,payload){
  if(topic!==tp('/h'))return;
  let m;try{m=JSON.parse(payload)}catch(e){return}
  if(m&&m.f)hostHandle(m.f,m);
}
/* معلومات الغرفة (عشان اللي يدخل بالكود أو الرابط يلقاها). ما فيه قائمة غرف عامة */
function publishRoom(){
  if(!Net.isHost||!Net.mq)return;
  const info={code:Net.code,n:active().length,max:MAX_PEOPLE,ts:Date.now(),b:Net.idx,priv:!!H.priv};
  Net.mq.publish(tp('/room'),JSON.stringify(info),true);
  // قائمة الغرف العامة: الخاصة ما تنحط فيها أبد
  const me=P(Net.myId);
  Net.mq.publish(TOPIC_ROOT+'list/'+Net.code,H.priv?'':JSON.stringify(Object.assign({host:me?me.name:''},info)),true);
}
function closeRoom(){
  if(!Net.mq)return;
  try{Net.mq.publish(tp('/room'),'',true);Net.mq.publish(TOPIC_ROOT+'list/'+Net.code,'',true)}catch(e){}
  Object.values(Net.peers).forEach(p=>{try{p.pc.close()}catch(e){}});Net.peers={};
}
function hostWatch(){
  const now=Date.now();let changed=false;
  H.players=H.players.filter(p=>{
    if(p.id===Net.myId||now-p.seen<=12000)return true;
    const pr=Net.peers[p.id];if(pr){try{pr.pc.close()}catch(e){}delete Net.peers[p.id]}
    if(H.sharer===p.id){H.sharer=null;H.lastFrame=null;H.fin={}}
    changed=true;return false;
  });
  H.players.forEach(p=>{const d=p.id===Net.myId||isDirect(p.id);if(p.direct!==d){p.direct=d;changed=true}});
  if(changed)pushRoom();
}
/* الصوت بـ Opus (أخف وأوضح) لو كل الأجهزة تدعمه، وإلا بالطريقة القديمة μ-law */
const roomCodec = ()=>H.players.every(p=>p.op)?'o':'m';
const roomVd = ()=>VCODECS.filter(c=>H.players.every(p=>(p.vd||[]).includes(c))); // صيغ الفيديو اللي كل الأجهزة تقدر تشغلها
const cleanVd = v=>Array.isArray(v)?v.filter(c=>VCODECS.includes(c)):[];
function pubPlayers(){return H.players.map(p=>({id:p.id,name:p.name,mic:!!p.mic,host:p.id===Net.myId,direct:p.id===Net.myId||isDirect(p.id)}))}
function roomMsg(){return{t:'room',d:{players:pubPlayers(),sharer:H.sharer,sk:H.sk,code:Net.code,hostId:Net.myId,b:Net.idx,priv:!!H.priv,pin:H.priv?Net.key:null,codec:roomCodec(),vd:roomVd()}}}
function pushRoom(){broadcast(roomMsg());publishRoom()}
function fullSync(id){
  sendTo(id,roomMsg());
  if(H.sharer&&H.lastFrame&&H.lastFrame.f!==id)sendFrameTo(id,H.lastFrame);
  if(H.sharer&&H.sharer!==id)requestKey(H.sharer);
}
function othersMsg(exceptId,msg){H.players.forEach(p=>{if(p.on&&p.id!==exceptId)sendTo(p.id,msg)})}
function hostHandle(id,m){
  if(!m||!m.t)return;
  const p=P(id);
  if(p)p.seen=Date.now();
  const d=m.d||{};
  switch(m.t){
    case 'hello':return onHello(id,d);
    case 'pi':if(p)sendTo(id,{t:'po',d:{ts:d.ts}});else askRejoin(id);return;
    case 'sync':if(p)fullSync(id);else askRejoin(id);return;
    case 'bye':return onBye(id);
    case 'rtc':if(p)hostRtc(id,d);return;
    case 'ice':if(p)hostIce(id,d);return;
  }
  if(!p){askRejoin(id);return}
  switch(m.t){
    case 'vc':return hostVoice(id,d);
    case 'nm':{const n=cleanName(d.name);if(n!==p.name){p.name=n;pushRoom()}return}
    case 'ms':if(p.mic!==!!d.on){p.mic=!!d.on;pushRoom()}return;
    case 'cp':if(p.op!==!!d.o){p.op=!!d.o;pushRoom()}return;
    case 'ss':return hostShare(id,!!d.on,d.k);
    case 'sf':return hostFrame(id,d);
    case 'kq':if(H.sharer)requestKey(H.sharer);return;
    case 'ch':return hostChat(id,p,d);
  }
}
/* واحد انحذف (نام جواله مثلاً) ورجع يرسل: نطلب منه يدخل من جديد */
function askRejoin(id){const now=Date.now();if(now-(H.rj[id]||0)<3000)return;H.rj[id]=now;sendTo(id,{t:'rejoin'},true)}
function onHello(id,d){
  const name=cleanName(d.name);
  const welcome={t:'welcome',d:{id,hostId:Net.myId,code:Net.code}};
  let p=P(id);
  if(p){p.on=true;p.seen=Date.now();p.name=name;p.op=!!d.op;p.vd=cleanVd(d.vd);sendTo(id,welcome,true);pushRoom();fullSync(id);return}
  if(H.priv&&String(d.k||'')!==Net.key)return sendTo(id,{t:'deny',d:{reason:'الرقم السري غلط 🔒',pin:true}},true);
  if(active().length>=MAX_PEOPLE)return sendTo(id,{t:'deny',d:{reason:'الغرفة ممتلئة ('+MAX_PEOPLE+' أشخاص)'}},true);
  H.players.push({id,name,on:true,seen:Date.now(),mic:false,direct:false,op:!!d.op,vd:cleanVd(d.vd)});
  sendTo(id,welcome,true);pushRoom();
  if(H.sharer&&H.lastFrame)sendFrameTo(id,H.lastFrame);
  if(H.sharer)requestKey(H.sharer);
  othersMsg(id,{t:'fx',d:{k:'toast',m:'👋 '+name+' دخل'}});
}
function onBye(id){
  const p=P(id);if(!p)return;
  const pr=Net.peers[id];if(pr){try{pr.pc.close()}catch(e){}delete Net.peers[id]}
  H.players=H.players.filter(x=>x.id!==id);
  if(H.sharer===id){H.sharer=null;H.lastFrame=null;H.fin={}}
  pushRoom();othersMsg(id,{t:'fx',d:{k:'toast',m:p.name+' طلع'}});
}
/* ---------- العرض عند المضيف: واحد بس يعرض بنفس الوقت، والمضيف يوزع الصور ---------- */
function hostShare(id,on,kind){
  if(on){
    const cur=H.sharer&&P(H.sharer);
    if(cur&&H.sharer!==id){sendTo(id,{t:'fx',d:{k:'ssdeny',m:cur.name+' يعرض الحين، انتظره يخلص'}});return}
    const k=['screen','cam','img','vid'].includes(kind)?kind:'screen';
    if(H.sharer!==id){H.sharer=id;H.lastFrame=null;H.fin={};H.lastFid=0;H.skipRun=0;H.mqNk=true;H.sk=k;Object.values(Net.peers).forEach(pr=>pr.nk=true);pushRoom()}
    else if(H.sk!==k){H.sk=k;pushRoom()}
  }else if(H.sharer===id){H.sharer=null;H.lastFrame=null;H.fin={};pushRoom()}
}
function hostFrame(from,d){
  if(from!==H.sharer||typeof d.a!=='string'||d.a.length>20000||typeof d.fid!=='number'||!(d.n>0&&d.n<=150)||!(d.i>=0&&d.i<d.n))return;
  if(d.fid<=H.lastFid)return;
  let f=H.fin;
  if(f.fid!==d.fid){if(f.fid&&d.fid<f.fid)return;H.fin=f={fid:d.fid,n:d.n,parts:new Array(d.n),got:0,M:{m:'j',q:0}}}
  if(d.i===0)f.M=cleanMeta(d);
  if(f.parts[d.i]==null){f.parts[d.i]=d.a;f.got++}
  if(f.got===f.n){H.fin={};hostFrameFull(from,f.fid,f.parts,f.M)}
}
/* معلومات الإطار: m نوعه (w صورة WebP، j صورة JPEG، v فيديو)، q مستوى الجودة، وللفيديو: k إطار أساسي، c الصيغة، w و h المقاس */
function cleanMeta(d){const m=d.m==='w'||d.m==='v'?d.m:'j',M={m,q:Number(d.q)||0};if(m==='v'){M.k=d.k?1:0;M.c=VCODECS.includes(d.c)?d.c:'vp8';M.w=d.w|0;M.h=d.h|0}return M}
function frameMsg(f,fid,i,n,a,M){const d={f,fid,i,n,a};if(i===0)Object.assign(d,M);return JSON.stringify({t:'sf',d})}

  code=String(code);

  await CAPP;
  Net.isHost=false;Net.leaving=false;Net.code=code;Net.key=key||null;
  Net.myId=sessionStorage.getItem('mj_id_'+code)||rid();sessionStorage.setItem('mj_id_'+code,Net.myId);
  const conns=await connectAll();
  const roomT=tp('/room');
  const chosen=await new Promise(res=>{
    if(!conns.length)return res(null);
    let fin=false;const t=setTimeout(()=>{fin=true;res(null)},4500);
    conns.forEach(c=>{c.mq.on((topic,p)=>{if(fin||topic!==roomT||!p)return;try{const info=JSON.parse(p);fin=true;clearTimeout(t);res({...c,info})}catch(e){}});c.mq.subscribe(roomT)});
  });
  conns.forEach(c=>{if(!chosen||c.mq!==chosen.mq)c.mq.end()});
  if(Net.leaving){if(chosen)chosen.mq.end();return false}

    if(conns.length&&!again){await sleep(1500);if(!Net.leaving)return joinRoom(code,key,true)} // محاولة ثانية
    toast(conns.length?'ما لقينا الغرفة — يمكن انتهت أو الكود غلط':'تعذّر الاتصال بالخوادم، تأكد من النت');goHome();

    chosen.mq.end();C.screen='pin';C.pinFor={room:code};C.pinErr=false;render();return false;
  }

  25:{f:5,  g:0.056, near:0.15},
  30:{f:6,  g:0.032, near:0.2},

/* كاتم ضوضاء خاص بالموقع (يشتغل مع عزل الصوت): يتعلّم صوت الخلفية الثابت (مكيف، مروحة، زحمة)
   ويطرحه من الصوت بتحليل الترددات (FFT 512 بتداخل نص). يشتغل على أي جهاز حتى لو المتصفح ما يدعم العزل. */
const DN = {rate:0,N:512,H:256,win:null,inb:new Float32Array(0),ola:null,noise:null,ps:null,g:null,re:null,im:null,cos:null,sin:null,rev:null};
function dnInit(rate){
  const N=DN.N;DN.rate=rate;DN.win=new Float32Array(N);for(let i=0;i<N;i++)DN.win[i]=Math.sin(Math.PI*(i+.5)/N);
  DN.inb=new Float32Array(0);DN.ola=new Float32Array(DN.H);DN.noise=null;DN.ps=null;DN.g=new Float32Array(N/2+1).fill(1);
  DN.re=new Float32Array(N);DN.im=new Float32Array(N);DN.cos=new Float32Array(N/2);DN.sin=new Float32Array(N/2);
  for(let i=0;i<N/2;i++){DN.cos[i]=Math.cos(2*Math.PI*i/N);DN.sin[i]=-Math.sin(2*Math.PI*i/N)}

function fft(re,im,inv){

  for(let i=0;i<N;i++){const j=rv[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let size=2;size<=N;size<<=1){const half=size>>1,step=N/size;
    for(let i=0;i<N;i+=size)for(let j=0;j<half;j++){const k=j*step,wr=DN.cos[k],wi=inv?-DN.sin[k]:DN.sin[k],a=i+j,b=a+half;

function denoise(x,rate){

  const out=[];
  while(inb.length>=N){
    const re=DN.re,im=DN.im,w=DN.win;
    for(let i=0;i<N;i++){re[i]=inb[i]*w[i];im[i]=0}
    fft(re,im,false);
    if(!DN.noise){DN.noise=new Float32Array(K);DN.ps=new Float32Array(K);for(let k=0;k<K;k++)DN.ps[k]=DN.noise[k]=re[k]*re[k]+im[k]*im[k]+1e-9}
    const nz=DN.noise,ps=DN.ps,g=DN.g;
    for(let k=0;k<K;k++){
      const p=re[k]*re[k]+im[k]*im[k]+1e-12;
      ps[k]=ps[k]*.7+p*.3;                                // طاقة كل تردد (منعّمة)
      nz[k]=ps[k]<nz[k]?nz[k]*.9+ps[k]*.1:nz[k]*1.002+1e-12; // نتابع أقل مستوى = صوت الخلفية
      let G=1-IL.f*nz[k]/ps[k];if(G<IL.g)G=IL.g;         // نطرح الخلفية حسب المستوى المختار (16 لين 50 ديسيبل) والكلام يبقى زي ما هو
      g[k]=G>g[k]?G*.7+g[k]*.3:G*.4+g[k]*.6;

}

function opusEnc(){

  try{
    V.enc=new AudioEncoder({output:ch=>{const u=new Uint8Array(ch.byteLength);ch.copyTo(u);V.ob.push(u);if(V.ob.length>=(weakNet()?6:3))opusFlush()},
      error:()=>{V.enc=null;CAP.o=false;if(C.joined)sendHost({t:'cp',d:{o:false}})}}); // لو تعطّل: نرجع للطريقة القديمة
    V.enc.configure({codec:'opus',sampleRate:OSR,numberOfChannels:1,bitrate:12000,opus:{frameDuration:40000,useinbandfec:true,packetlossperc:10}});
    V.ets=0;return V.enc;

}
function opusFlush(){if(!V.ob.length)return;const o=V.ob.map(u8b64);V.ob=[];voiceOut({n:V.seq++,c:'o',o})}

function voicePlay(d){

  const last=V.seqs[d.f];if(last!=null&&d.n<=last)return;V.seqs[d.f]=d.n; // بدون تكرار (لو وصل من الطريقين)
  C.talk[d.f]=performance.now();

  if(d.c==='o'){
    if(!Array.isArray(d.o)||!window.AudioDecoder)return;

    if(!dec||dec.state==='closed'){
      const from=d.f;
      try{dec=V.dec[from]=new AudioDecoder({output:ad=>{try{
          const n=ad.numberOfFrames,sz=ad.allocationSize({planeIndex:0});let pcm;
          if(String(ad.format).startsWith('s16')){const i16=new Int16Array(sz/2);ad.copyTo(i16,{planeIndex:0});pcm=new Float32Array(n);for(let i=0;i<n;i++)pcm[i]=i16[i]/32768}

        error:()=>{V.dec[from]=null}});

/* تشغيل مقطع صوت بمخزن ذكي لكل متكلم (منقول من اللعبة) */
function playPcm(from,pcm,rate){
  const ctx=V.ctx;if(!ctx||!pcm.length)return;

  const wk=voiceWeak(from,now); // نت المتكلم (أو نتك) ضعيف جدًا ويتقطع؟
  if(t<now+0.01){
    if(prev&&now-prev<(wk?1.5:0.35)){ // وصل متأخر وسط الكلام: نكبّر المخزن عشان ما يتقطع
      const G=V.gap||(V.gap={});G[from]=(G[from]||[]).filter(x=>now-x<20).concat(now);

function hostChat(id,p,d){
  const mid=String(d.id==null?'':d.id).slice(0,16);
  if(typeof d.x==='string'){const x=d.x.trim().slice(0,500);if(x)broadcast({t:'ch',d:{f:id,nm:p.name,id:mid,x}});return}
  if(typeof d.a!=='string'||d.a.length>15000||!(d.n>0&&d.n<=20)||!(d.i>=0&&d.i<d.n))return;
  broadcast({t:'ch',d:{f:id,nm:p.name,id:mid,i:d.i,n:d.n,m:d.m==='w'?'w':'j',a:d.a}});
}
/* الاستقبال: النص على طول، والصورة نجمّع قطعها */
function chatRecv(d){
  if(!d||!d.f||d.f===C.me)return;
  if(typeof d.x==='string'){chatAdd({f:d.f,nm:d.nm,x:d.x});return}
  if(typeof d.a!=='string'||!(d.n>0&&d.n<=20)||!(d.i>=0&&d.i<d.n))return;
  const k=d.f+':'+d.id,now=Date.now();let c=CH.in[k];
  if(!c){for(const j in CH.in)if(now-CH.in[j].t>60000)delete CH.in[j];c=CH.in[k]={n:d.n,parts:new Array(d.n),got:0,t:now}}
  if(c.parts[d.i]==null){c.parts[d.i]=d.a;c.got++}
  if(c.got===c.n){delete CH.in[k];try{chatAdd({f:d.f,nm:d.nm,url:chatUrl(c.parts.join(''),d.m)})}catch(e){}}
}

/* ================= 9) الواجهات ================= */
const app=$('#app');
const hue = s=>{let h=0;for(const ch of String(s))h=(h*31+ch.codePointAt(0))%360;return h};
const initial = s=>{const a=Array.from(String(s||'').trim());return a.length?a[0]:'؟'};

function render(){
  updateChips();
  let h='';
  if(!C.joined)h=C.screen==='connecting'?vWait(C.connMsg||'جاري الاتصال…'):C.screen==='pin'?vPin():C.screen==='rooms'?vRooms():vHome();
  else h=vRoom();
  const fe=document.activeElement,fid=fe&&fe.id&&app.contains(fe)?fe.id:null,val=fid?fe.value:null;
  app.innerHTML=h;
  if(fid){const n=document.getElementById(fid);if(n&&n.focus){if(val!=null&&'value' in n)n.value=val;n.focus()}}
  updateStage();
}
function updateChips(){
  const el=$('#chips');if(!el)return;
  if(!C.joined){el.innerHTML='';return}
  const n=C.room?C.room.players.length:1;
  let net;
  if(Net.reconnecting)net='<span class="chip"><i class="dot x"></i> يعيد الاتصال…</span>';
  else if(Net.isHost)net='<span class="chip"><i class="dot d"></i> أنت المضيف</span>';
  else net='<span class="chip"><i class="dot '+(C.direct?'d':'s')+'"></i> '+(C.direct?'مباشر':'خادم')+(C.rtt!=null?' · '+C.rtt+'ms':'')+'</span>';
  el.innerHTML='<button class="chip" data-a="copy" title="نسخ الرابط">#'+esc(Net.code||'')+'</button><span class="chip">👥 '+n+'</span>'+net;
}
function vWait(msg){return'<div class="c"><div class="spin"></div><div style="font-weight:800;font-size:18px">'+esc(msg)+'</div><button class="btn ghost small" style="margin:24px auto 0;max-width:200px" data-a="cancel">إلغاء</button></div>'}
function vHome(){
  let h='<div class="home"><div class="hero"><div class="ic">📞</div><div class="big">مجلس</div><p>اجتماعات بالصوت وعرض الشاشة من المتصفح — بدون تحميل ولا تسجيل</p></div>';
  h+='<div class="card"><div class="sect">➕ سوّ غرفة</div><div class="two">'+
     '<button class="btn" data-a="create"><span>🌐 غرفة عامة</span><small>أي أحد معه الكود يدخل</small></button>'+
     '<button class="btn vio" data-a="createp"><span>🔒 غرفة خاصة</span><small>كود + رقم سري، والرابط يدخل على طول</small></button></div></div>';
  h+='<div class="card"><div class="sect">🚪 ادخل غرفة</div>'+
     '<button class="btn teal" style="margin-top:0" data-a="rooms">🌐 ادخل غرفة عامة <small style="font-weight:600;opacity:.85">(شوف الغرف المفتوحة)</small></button>'+
     '<div class="or">أو</div>'+
     '<label class="lb" for="lk">🔗 الصق الرابط اللي أرسله لك المضيف</label><div class="row"><input class="inp ltr" id="lk" placeholder="https://…" autocomplete="off"><button class="btn sec small auto" data-a="joinlk">دخول</button></div>'+
     '<div class="or">أو</div>'+
     '<label class="lb" for="cd">🔢 اكتب كود الغرفة بس</label><div class="row"><input class="inp num" id="cd" inputmode="numeric" maxlength="5" placeholder="12345" autocomplete="off"><button class="btn sec small auto" data-a="joincd">دخول</button></div></div>';
  h+='<div class="hint" style="opacity:.6">النسخة 7 · دردشة + صوت أثبت للنت الضعيف + نت أقل</div>';
  return h+'</div>';

/* ---------- الغرف العامة المفتوحة ---------- */
let RoomsConns=null,roomsRT=null,roomsTick=null;
async function openRooms(){
  closeRoomsConns();C.screen='rooms';C.rooms={};C.roomsLoading=true;render();
  const conns=await connectAll();
  if(C.screen!=='rooms'){conns.forEach(c=>c.mq.end());return}
  RoomsConns=conns;
  if(!conns.length){C.roomsLoading=false;toast('تعذّر الاتصال بالخوادم، تأكد من النت');render();return}
  const pre=TOPIC_ROOT+'list/';
  conns.forEach(c=>{c.mq.on((t,p)=>{
    if(!t.startsWith(pre))return;const key=t.slice(pre.length);
    if(!p)delete C.rooms[key];else{try{const r=JSON.parse(p);if(r&&r.code&&!r.priv){r.b=c.idx;C.rooms[key]=r;
      if(Date.now()-r.ts>6*60000)try{c.mq.publish(t,'',true)}catch(e){}}}catch(e){}} // تنظيف الغرف القديمة
    if(!roomsRT)roomsRT=setTimeout(()=>{roomsRT=null;if(C.screen==='rooms')render()},250);
  });c.mq.subscribe(pre+'+')});
  setTimeout(()=>{C.roomsLoading=false;if(C.screen==='rooms')render()},2500);
  clearInterval(roomsTick);roomsTick=setInterval(()=>{if(C.screen==='rooms')render();else closeRoomsConns()},5000);
}
function closeRoomsConns(){clearInterval(roomsTick);if(RoomsConns){RoomsConns.forEach(c=>c.mq.end());RoomsConns=null}}
function vRooms(){
  const now=Date.now(),seen=new Set();
  const list=Object.values(C.rooms||{}).filter(r=>Math.abs(now-r.ts)<75000&&!seen.has(r.code)&&seen.add(r.code))
    .sort((a,b)=>((a.n<(a.max||MAX_PEOPLE))===(b.n<(b.max||MAX_PEOPLE))?0:(a.n<(a.max||MAX_PEOPLE)?-1:1))||(b.n-a.n)||(b.ts-a.ts));
  let h='<div class="home"><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="sect" style="margin:0">🌐 الغرف العامة المفتوحة</div><button class="chip" data-a="rooms">🔄 تحديث</button></div>';
  if(!list.length)h+=C.roomsLoading?'<div class="spin" style="margin:20px auto"></div><div class="c mut">نجمع الغرف…</div>':'<div class="c" style="padding:14px 0"><div style="font-size:46px">🏜️</div><div style="font-weight:800;margin:6px 0">ما فيه غرف عامة الحين</div><div class="hint">القائمة تتحدث لحالها، أو سوّ غرفتك</div></div>';
  h+=list.map(r=>{const mx=r.max||MAX_PEOPLE,full=r.n>=mx;
    return'<div class="room"><div class="rav" style="--h:'+hue(r.host||r.code)+'">'+esc(initial(r.host||'؟'))+'</div><div class="ri"><div class="rn">غرفة '+esc(r.host||'مضيف')+'</div><div class="rs">👥 '+r.n+'/'+mx+' · <span style="direction:ltr">#'+esc(r.code)+'</span></div></div>'+
      (full?'<button class="btn sec small auto" disabled>ممتلئة</button>':'<button class="btn teal small auto" data-a="joinroom" data-v="'+esc(r.code)+'">ادخل</button>')+'</div>'}).join('');
  return h+'</div><button class="btn" data-a="create">🌐 سوّ غرفة عامة</button><button class="btn ghost small" data-a="cancel">رجوع</button></div>';
}
function vPin(){
  const r=C.pinFor||{};
  return'<div class="home"><div class="card c" style="margin-top:30px"><div style="font-size:44px">🔒</div><div style="font-weight:800;font-size:20px">الغرفة '+esc(r.room||'')+' خاصة</div>'+
    '<div class="hint" style="margin:2px 0 12px">اكتب الرقم السري (4 أرقام) اللي عند صاحب الغرفة</div>'+
    '<input class="inp num" id="pn" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">'+
    (C.pinErr?'<div class="err">الرقم السري غلط، جرّب مرة ثانية</div>':'')+
    '<button class="btn vio" style="margin-top:12px" data-a="joinpin">🚪 دخول</button><button class="btn ghost small" data-a="cancel">رجوع</button></div></div>';
}
function vRoom(){
  const R=C.room;if(!R)return vWait('جاري الدخول…');
  const n=R.players.length;
  let h='';
  if(!soundOk())h+='<div class="soundbar"><button class="btn teal" data-a="sound">🔊 اضغط هنا عشان تسمع الصوت</button></div>';
  if(n<=1||!R.sharer){
    h+='<div class="card info"><div class="irow"><div><div class="mut small">كود الغرفة</div><div class="code">'+esc(R.code)+'</div></div>'+
      (R.priv?'<div><div class="mut small">الرقم السري</div><div class="code pin">'+esc(R.pin||'')+'</div></div>':'')+
      '<span class="tag '+(R.priv?'priv':'pub')+'">'+(R.priv?'🔒 غرفة خاصة':'🌐 غرفة عامة')+'</span></div>'+
      '<div class="invite"><input class="inp ltr" id="lnk" readonly value="'+esc(roomLink())+'"><button class="btn sec small auto" data-a="copy">📋 نسخ الرابط</button><button class="btn sec small auto" data-a="invite">📤 مشاركة</button></div>'+
      '<div class="hint">'+(R.priv?'اللي يضغط الرابط يدخل على طول. وإذا دخل بالكود، يكتب الرقم السري.':'اللي يضغط الرابط يدخل على طول، أو يكتب الكود في الصفحة الرئيسية.')+'</div></div>';
  }
  h+='<div class="grid'+(R.sharer?' sm':'')+'">'+R.players.map(p=>{
    const me=p.id===C.me,mic=me?V.on:p.mic;
    return'<div class="tile" data-id="'+esc(p.id)+'" style="--h:'+hue(p.name)+'"><div class="bd">'+(p.host?'<span class="tag host">المضيف</span>':'')+(p.id===R.sharer?'<span class="tag scr">'+(R.sk==='cam'?'📷':R.sk==='img'?'🖼️':R.sk==='vid'?'🎬':'🖥️')+' يعرض</span>':'')+'</div>'+
      '<div class="av">'+esc(initial(p.name))+'</div><div class="nm">'+esc(p.name)+(me?' (أنت)':'')+'</div>'+
      '<div class="mi'+(mic?' on':'')+'">'+(mic?'🎙️':'🔇')+'</div>'+(p.host?'':'<div class="cn" title="'+(p.direct?'اتصال مباشر':'عبر الخادم')+'">'+(p.direct?'⚡':'☁️')+'</div>')+'</div>'}).join('')+'</div>';
  h+='<div class="bar">'+
    '<button class="cb '+(V.on?'on':'off')+'" data-a="mic"><span class="i">'+(V.on?'🎙️':'🔇')+'</span>'+(V.on?'المايك شغال':'المايك مقفل')+'</button>'+
    '<button class="cb'+(V.iso?' on':'')+'" data-a="iso"><span class="i">🎧</span>'+(V.iso?'العزل '+V.isoDb+'dB 🔋':'عزل الصوت')+'</button>'+
    '<button class="cb'+(S.on?' on':'')+'" data-a="share"><span class="i">'+(S.on?'⏹️':'🖥️')+'</span>'+(S.on?'إيقاف العرض':'اعرض')+'</button>'+
    '<button class="cb'+(CH.open?' on':'')+'" data-a="chat"><span class="i">💬</span>دردشة<span class="nb" id="chbd">'+(CH.unread?(CH.unread>9?'9+':CH.unread):'')+'</span></button>'+
    '<button class="cb" data-a="invite"><span class="i">🔗</span>دعوة</button>'+
    '<button class="cb leave" data-a="leave"><span class="i">📞</span>خروج</button></div>';
  return h;
}
/* شاشة العرض: عنصر ثابت ما ينعاد رسمه (عشان ملء الشاشة ما يطلع) */
function updateStage(){
  const box=$('#stagebox'),sh=C.joined&&C.room&&C.room.sharer;
  if(!sh){if(box.dataset.sh){box.innerHTML='';box.dataset.sh='';box.className='';if(isFs())(document.exitFullscreen||document.webkitExitFullscreen).call(document)}return}
  if(box.dataset.sh!==sh){box.dataset.sh=sh;box.className='stage';box.innerHTML='<img id="scr" alt=""><canvas id="scv"></canvas><div class="ph" id="scrph"><div class="spin"></div><span></span></div><div class="lbl" id="slbl"></div><div class="sbtns" id="sbtns"></div>'}
  const me=sh===C.me,nm=pname(sh),k=C.room.sk||'screen',what=k==='cam'?'الكاميرا':k==='img'?'صورة':k==='vid'?'تسجيل شاشة':'شاشته';
  const q=me?S.lv:F.q;
  $('#slbl').textContent=(k==='cam'?'📷 ':k==='img'?'🖼️ ':k==='vid'?'🎬 ':'🖥️ ')+(me?'أنت تعرض '+(k==='screen'?'شاشتك':what):nm+' يعرض '+what)+((C.frameUrl||C.vidOn)&&k!=='img'?' · الجودة: '+LV_NAMES[q]:'');
  let b='';
  if(me){b+='<button class="sbtn stop" data-a="share">⏹️ إيقاف</button>';if(k==='cam')b+='<button class="sbtn" data-a="flip">🔄 قلب الكاميرا</button>';if(k==='img')b+='<button class="sbtn" data-a="src" data-v="img">🖼️ صورة ثانية</button>';
    if(k==='vid'&&S.video){b+='<button class="sbtn" data-a="vidpp">'+(S.video.paused?'▶️ تشغيل':'⏸️ إيقاف مؤقت')+'</button><button class="sbtn" data-a="vidre">🔁 من البداية</button>'}}
  else b+='<button class="sbtn" data-a="fs">'+((isFs()||C.max)?'✕ تصغير':'⛶ ملء الشاشة')+'</button>';
  const sb=$('#sbtns');if(sb.innerHTML!==b)sb.innerHTML=b;
  const pic=!!(C.frameUrl||C.vidOn);
  const ph=$('#scrph');if(ph){ph.style.display=pic?'none':'';ph.querySelector('span').textContent=me?'جاري التجهيز…':'جاري التحميل من '+nm+'…'}
  const img=$('#scr');if(C.frameUrl&&img.getAttribute('src')!==C.frameUrl){img.src=C.frameUrl}img.classList.toggle('show',!!C.frameUrl&&!C.vidOn);
  $('#scv').classList.toggle('show',!!C.vidOn);
  box.classList.toggle('max',!!C.max);
}
/* مين يتكلم الحين */
setInterval(()=>{const now=performance.now();document.querySelectorAll('.tile[data-id]').forEach(el=>el.classList.toggle('spk',now-(C.talk[el.dataset.id]||0)<400))},150);

/* الأحداث */
const nmEl=$('#nm');nmEl.value=LS.get('mj_name','')||'';
let nmT=null;
nmEl.addEventListener('input',()=>{LS.set('mj_name',nmEl.value);clearTimeout(nmT);nmT=setTimeout(()=>{if(C.joined)sendHost({t:'nm',d:{name:myName()}})},500)});
nmEl.addEventListener('keydown',e=>{if(e.key==='Enter')nmEl.blur()});
function joinFrom(v){const L=parseJoin(v);if(!L){toast('الرابط أو الكود مو صحيح');return}joinRoom(L.room,L.k)}
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  if(e.target.closest&&e.target.closest('#chview')){$('#chview').classList.remove('show');return}
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'create':closeRoomsConns();createRoom(false);break;
    case 'createp':closeRoomsConns();createRoom(true);break;
    case 'rooms':openRooms();break;
    case 'joinroom':closeRoomsConns();joinRoom(v,null);break;
    case 'joinlk':joinFrom(($('#lk')||{}).value);break;
    case 'joincd':{const c=(($('#cd')||{}).value||'').replace(/\D/g,'');if(c.length!==5){toast('الكود 5 أرقام');break}joinRoom(c,null);break}
    case 'joinpin':{const p=(($('#pn')||{}).value||'').replace(/\D/g,'');if(p.length!==4){toast('الرقم السري 4 أرقام');break}joinRoom(C.pinFor.room,p);break}
    case 'cancel':goHome();break;
    case 'leave':if(!Net.isHost||window.confirm('أنت صاحب الغرفة — إذا طلعت ينتهي الاجتماع على الكل. متأكد؟'))leaveRoom();break;
    case 'copy':copyLink();break;
    case 'invite':if(navigator.share)navigator.share({title:'مجلس',text:'تعال ادخل الاجتماع معي 📞'+(C.room&&C.room.priv?'':' — الكود: '+Net.code),url:roomLink()}).catch(()=>{});else copyLink();break;
    case 'sound':voiceCtx();setTimeout(render,250);break;
    case 'mic':micToggle();break;
    case 'share':if(S.on){shareStop(true);render();toast('⏹️ وقفت العرض')}else openSheet();break;
    case 'src':if(v==='screen')shareStart('screen');else if(v==='camb')shareStart('cam','environment');else if(v==='camf')shareStart('cam','user');else if(v==='img'){$('#imgpick').click();closeSheet()}else if(v==='vid'){$('#vidpick').click();closeSheet()}break;
    case 'iso':openIsoSheet();break;
    case 'isolv':setIso(v);break;
    case 'vidpp':if(S.video){if(S.video.paused)S.video.play().catch(()=>{});else S.video.pause();setTimeout(updateStage,50)}break;
    case 'vidre':if(S.video){S.video.currentTime=0;S.video.play().catch(()=>{});setTimeout(updateStage,50)}break;
    case 'flip':shareStart('cam',S.facing==='user'?'environment':'user');break;
    case 'sheetx':closeSheet();break;
    case 'fs':toggleFs();break;
    case 'chat':chatToggle();break;
    case 'chatx':chatToggle(false);break;
    case 'chsend':chatSend();break;
    case 'chimg':$('#chpick').click();break;
    case 'chcam':chatCam();break;
    case 'chsnap':chatSnap();break;
    case 'chcamx':chatCamStop();break;
    case 'chview':$('#chvimg').src=el.src;$('#chview').classList.add('show');break;
  }
});
$('#imgpick').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f&&C.joined)shareStart('img',f)});
$('#chpick').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f&&C.joined)chatImg(f)});
$('#chcampick').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f&&C.joined)chatImg(f)});
$('#chin').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();chatSend()}});
$('#vidpick').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f&&C.joined)shareStart('vid',f)});
$('#app').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const m={lk:'joinlk',cd:'joincd',pn:'joinpin'}[e.target.id];if(m){const b=document.querySelector('[data-a='+m+']');if(b)b.click()}
});
/* تفعيل الصوت: داخل الغرفة بأي ضغطة، وبره بس من أزرار الدخول (عشان ما يوقف الأغاني في جوالك وأنت بالصفحة الرئيسية) */
const VOICE_KEYS=['create','createp','joinlk','joincd','joinpin','joinroom'];
const voiceTap=e=>{if(C.joined||V.ctx){const was=soundOk();voiceCtx();if(!was&&C.joined)setTimeout(()=>{if(soundOk())render()},250);return}const el=e.target&&e.target.closest&&e.target.closest('[data-a]');if(el&&VOICE_KEYS.includes(el.dataset.a))voiceCtx()};
document.addEventListener('click',voiceTap,true);
['touchend','pointerup'].forEach(ev=>document.addEventListener(ev,voiceTap,{capture:true,passive:true})); // الآيفون يحتاج لمسة عشان يشغّل الصوت
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')voiceWake()});
function copyLink(){
  const u=roomLink();
  const ok=()=>toast('تم نسخ الرابط ✅ أرسله للناس');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(u).then(ok).catch(()=>fallbackCopy(u,ok));else fallbackCopy(u,ok);
}
function fallbackCopy(u,ok){const t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast(u)}t.remove()}

/* للتجربة الآلية فقط */
window.__mj={C,H,Net,V,S,F,CAP,CH};
render();
if(C.pending)joinRoom(C.pending.room,C.pending.k); // فتحت الرابط: ندخلك على طول
